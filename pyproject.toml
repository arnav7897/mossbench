[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mossbench"
version = "0.1.0"
description = "Reproducible benchmarks for Moss retrieval, inference, and tasks APIs"
requires-python = ">=3.11"
dependencies = ["moss==1.26.0"]

[project.scripts]
mossbench = "mossbench.cli:main"

[tool.setuptools.packages.find]
include = ["mossbench*"]
